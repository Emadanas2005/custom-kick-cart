<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Shopping Cart | SoleVault Sneakers</title>
  <meta name="description" content="Review the sneakers in your SoleVault cart, update sizes and quantities, check shipping charges and continue to secure payment." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <nav class="nav__inner" aria-label="Main navigation">
      <a class="brand" href="index.html">
        <span class="brand__mark">S</span>
        <span class="brand__name">Sole<span>Vault</span></span>
      </a>
      <button class="nav__toggle" aria-label="Toggle menu">☰</button>
      <ul class="nav__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a class="active" href="cart.html">Cart</a></li>
        <li><a href="payment.html">Checkout</a></li>
      </ul>
      <a class="nav__cart" href="cart.html">🛒 Cart <span class="cart-count" data-cart-count>0</span></a>
    </nav>
  </header>

  <section class="page-head">
    <div class="wrap">
      <h1>Shopping Cart</h1>
      <p class="crumbs"><a href="index.html">Home</a> / <a href="products.html">Products</a> / Cart</p>
    </div>
  </section>

  <main class="section">
    <div class="wrap layout">
      <!-- Cart line items (rendered by js/cart.js) -->
      <section id="cartItems" aria-label="Cart items"></section>

      <!-- Order summary -->
      <aside class="summary">
        <div id="cartSummary"></div>
        <button class="btn btn--primary btn--block" id="checkoutBtn" style="margin-top:18px">Proceed to Payment</button>
        <p style="margin-top:12px;text-align:center"><a href="products.html" style="font-weight:700;font-size:.9rem">← Continue shopping</a></p>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer__bottom" style="border:0;margin:0">
      <span>© 2026 SoleVault. All rights reserved.</span>
      <span>Cart saved locally in your browser</span>
    </div>
  </footer>

  <script src="js/products.js" defer></script>
  <script src="js/cart.js" defer></script>
</body>
</html>
